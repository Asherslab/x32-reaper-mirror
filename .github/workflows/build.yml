name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
          - name: macos-universal
            os: macos-latest
          - name: windows-x64
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (for x32sim + integration test)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # SWELL's generic module stub links against libdl and dynamically loads
      # REAPER's own SWELL at runtime, so no GTK/X11 dev packages are needed to
      # *build* the module. Perl is used by swell_resgen (preinstalled on the
      # Ubuntu/macOS runners).
      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        # Let CMake auto-detect whichever Visual Studio the runner image ships
        # (the generator version drifts as GitHub rolls the windows image), and
        # force a 64-bit build.
        run: cmake -S . -B build -A x64

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: cmake --build build --parallel

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel

      # Unit tests everywhere; the headless integration test (which also
      # enforces the one-way guarantee via x32sim) runs on Unix where python3
      # spawning is used.
      - name: Test (Unix)
        if: runner.os != 'Windows'
        working-directory: build
        run: ctest --output-on-failure

      - name: Test (Windows)
        if: runner.os == 'Windows'
        working-directory: build
        run: ctest --output-on-failure -C Release

      - name: One-way guarantee scripted check (Unix)
        if: runner.os != 'Windows'
        run: |
          # The simulator exits non-zero if it ever receives a value-carrying
          # set message. A clean scripted run confirms the harness itself is
          # healthy; the integration test above is what actually drives the
          # plugin's socket layer against it.
          python3 tools/x32sim/x32sim.py --script tools/x32sim/selftest.script --quiet
          echo "sim self-test exit: $?"

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          find build -maxdepth 3 \( -name 'reaper_x32mirror.*' -o -name 'x32mirror_embed.*' \) \
            -type f ! -name '*.o' ! -name '*.obj' -exec cp {} dist/ \; || true
          ls -la dist || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x32mirror-${{ matrix.name }}
          path: dist/
          if-no-files-found: warn
